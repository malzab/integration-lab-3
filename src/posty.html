<!DOCTYPE html>
<html>
<head>
  <title>Post Strona</title>
</head>
<body>

<h2>Podsumowanie aktywności użytkowników:</h2>
<div id="stats"></div>

<h3>Posty:</h3>
<ul id="list"></ul>

<script>
fetch('/api/posty')
  .then(res => res.json())
  .then(data => {

    document.getElementById("stats").innerHTML =
      `Użytkownik ${data.stats.userId} napisał ${data.stats.count} postów<br>
       Średnia długość tytułu: ${data.stats.avgTitleLength.toFixed(2)}`;

    const list = document.getElementById("list");

    data.posts.forEach(p => {
      const li = document.createElement("li");
      li.textContent = p.id + ". "+ p.title;
      list.appendChild(li);
    });

  });
</script>

</body>
</html>
